 size",body:"Right-click for Font Size. The toolbar A- / A+ buttons resize the labels of everything selected."},{label:"Copy formatting",body:"Select a bar, click the brush in the toolbar, then click another bar to paste its fill, frame, text colour and size. Double-click the brush to keep painting bar after bar; click it again or press Escape to stop. Nothing else about the bar moves - only the formatting."},{label:"Status",body:"Right-click and pick Status. No status leaves the bar as it is; Not relevant hatches the whole bar in diagonal grey; Not started, In progress and Done draw a grey rail inside the bottom edge - empty, half, full. Milestones take a status too."},{label:"Hide every status",body:"The target button in the toolbar shows or hides all the status marks at once, so a plan can be reviewed with delivery state on and exported without it."},{label:"Annotation",body:"Right-click and choose Add Annotation. Enter saves, Escape discards."}]},{id:"selection",title:"Selection and editing",icon:"Move",color:"#f59e0b",items:[{label:"Multi-select",body:"Ctrl-click (or Shift-click) bars to build a selection. Colour, font size and deletion then apply to all of them in a single undo step."},{label:"Keyboard",body:"Arrows nudge the selection, Shift+arrows resize, Alt+arrows move it between rows. Each press is one undo entry."},{label:"Copy and paste",body:"Ctrl+C copies the selected bars and Ctrl+V pastes them into the row of whatever is selected, one undo per paste. Ctrl+D duplicates the selection one unit later."},{label:"Find",body:"Ctrl+F searches activity and row names - including Hebrew - and jumps to a match."}]},{id:"timeline",title:"Timeline",icon:"Calendar",color:"#0ea5e9",items:[{label:"Months or weeks",body:"Mo / Wk switch between two independent charts. Each keeps its own rows, bars and zoom."},{label:"Right-to-left",body:"The direction button mirrors the whole chart: the earliest date moves to the right edge, the sidebar moves to the right, and month names switch to Hebrew."},{label:"Zoom",body:"Ctrl + mouse wheel zooms around the pointer; the toolbar buttons zoom around the centre. Fit to View sizes the chart to the window."},{label:"Holidays",body:"Israeli public holidays - the actual days off - are shaded in red, sized in proportion to their real length."},{label:"Markers",body:"Named vertical lines for deadlines and gates. They are stored as real dates, so they hold their place when the chart range changes."}]},{id:"dependencies",title:"Dependencies",icon:"Waypoints",color:"#8b5cf6",items:[{label:"Draw an arrow",body:"Turn on Connect, then drag from a dot on one bar to a dot on another."},{label:"They are decoration",body:"Arrows are drawn geometry, not constraints. Nothing reschedules when a bar moves - that is deliberate."},{label:"Delete",body:"Click an arrow to select it and press Delete, or right-click it."}]},{id:"saving",title:"Saving and export",icon:"Save",color:"#22c55e",items:[{label:"Autosave",body:"Your work is saved to this browser automatically, and restored when you return. If storage is full the app says so rather than failing quietly."},{label:"Named saves",body:"Save stores the chart you are currently editing - months or weeks - under its name. Open lists them; deleting one asks for confirmation because it cannot be undone."},{label:"JSON",body:"Export writes a .gantt.json file; Import reads one back. Imported files are checked and repaired before they reach the chart."},{label:"Images",body:"Snapshot (JPEG) copies to the clipboard and downloads. Snapshot (SVG) stays sharp at any size. Both use the current theme background."},{label:"Print / PDF",body:"Print lays the chart out in landscape and hides the toolbar. Use your browser Save as PDF."},{label:"Templates",body:"Start from a template fills a chart with a starting shape."}]}],$O=[{keys:["Ctrl","Z"],description:"Undo"},{keys:["Ctrl","Shift","Z"],description:"Redo"},{keys:["Ctrl","A"],description:"Select all bars"},{keys:["Ctrl","D"],des
